{% extends 'base.html' %}{% block content %}<h1>{{ questionnaire.title }}</h1><p>Atribua uma nota de 0 a 10 a cada fator.</p><form method="post" class="form"><label>Setor<input name="sector" maxlength="120" value="Geral"></label>{% for q in questionnaire.questions %}<label>{{ q.label }} <small>({{ 'Estratégia e processos' if q.axis == 'Y' else 'Infraestrutura e tecnologia' }})</small><input name="question-{{ q.id }}" type="number" min="0" max="10" required></label>{% endfor %}<button>Ver resultado</button></form>{% endblock %}
