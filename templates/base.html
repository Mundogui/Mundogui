<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIAPD Matrix</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head><body><nav><a href="{{ url_for('home') }}">SIAPD Matrix</a>{% if current_user.is_authenticated %}<a href="{{ url_for('dashboard') }}">Painel</a><form method="post" action="{{ url_for('logout') }}"><button>Sair</button></form>{% else %}<a href="{{ url_for('login') }}">Entrar</a>{% endif %}</nav><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
