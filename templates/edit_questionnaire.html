{% extends 'base.html' %}{% block content %}<h1>{{ questionnaire.title }}</h1><form method="post" class="form"><label>Título<input name="title" value="{{ questionnaire.title }}" required></label>{% for q in questionnaire.questions %}<fieldset><legend>Fator {{ loop.index }}</legend><label>Texto<input name="label-{{ q.id }}" value="{{ q.label }}" required maxlength="500"></label><label>Eixo<select name="axis-{{ q.id }}"><option value="Y" {% if q.axis == 'Y' %}selected{% endif %}>Y — Estratégia e processos</option><option value="X" {% if q.axis == 'X' %}selected{% endif %}>X — Infraestrutura e tecnologia</option></select></label></fieldset>{% endfor %}<label class="check"><input type="checkbox" name="is_published" {% if questionnaire.is_published %}checked{% endif %}> Publicar questionário</label><button>Salvar</button></form>{% endblock %}
